[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "sqlite",
    "macros",
    "chrono",
    "runtime-tokio",
    "migrate",
] }
tokio = { version = "1.54.1", features = ["full", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "local-time",
    "env-filter",
    "tracing",
] }

# `sqlx-sqlite` 0.9.0 fija `libsqlite3-sys` en `>=0.30.1, <0.38.0`, rango en el
# que TODAS las versiones están afectadas por RUSTSEC-2026-0459 (SQLite embebido
# < 3.54.0). La copia vendorizada solo amplía ese requisito a `>=0.39.0, <0.41.0`
# para poder seleccionar la versión parcheada. Ver `vendor/sqlx-sqlite/README.md`.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
